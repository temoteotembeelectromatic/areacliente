{% extends "base.html" %}

{% block content %}
  <section class="password-reset-page">
    <div class="password-reset-panel">
      <span class="eyebrow">Segurança da conta</span>
      <h1>Defina a sua palavra-passe</h1>
      <p>A palavra-passe inicial é temporária. Para continuar, escolha uma nova palavra-passe com pelo menos 12 caracteres.</p>
      <form method="post" class="password-reset-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label>Nova palavra-passe
          <input type="password" name="password" minlength="12" autocomplete="new-password" required autofocus>
        </label>
        <label>Confirmar nova palavra-passe
          <input type="password" name="password_confirmation" minlength="12" autocomplete="new-password" required>
        </label>
        <button class="primary-button" type="submit">Guardar palavra-passe</button>
      </form>
    </div>
  </section>
{% endblock %}
