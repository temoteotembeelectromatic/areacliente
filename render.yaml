services:
  - type: web
    name: area-cliente
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: CLIENT_EMAIL
        value: cliente.teste@exemplo.pt
      - key: CLIENT_PASSWORD_HASH
        sync: false
      - key: CONTROLLER_LEGAL_NAME
        value: Smartic Pro - Ambiente de Teste
      - key: CONTROLLER_ADDRESS
        value: Morada de teste - substituir antes de producao
      - key: PRIVACY_EMAIL
        value: privacidade.teste@exemplo.pt
      - key: PRIVACY_UPDATED_AT
        value: 2026-08-17
