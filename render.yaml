services:
  - type: web
    name: area-cliente
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: CLIENT_EMAIL
        sync: false
      - key: CLIENT_PASSWORD_HASH
        sync: false
      - key: CONTROLLER_LEGAL_NAME
        sync: false
      - key: CONTROLLER_ADDRESS
        sync: false
      - key: PRIVACY_EMAIL
        sync: false
      - key: PRIVACY_UPDATED_AT
        value: 2026-08-17
